name: Import original MOKO source (one-time)

on:
  push:
    branches: [main]
    paths: ['.moko-import/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moko-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify archive and restore original source
        run: node .moko-import/extract.mjs
      - name: Check source and build offline edition
        run: |
          for file in core.js renderer.js app.js build.mjs server.mjs; do
            node --check "$file"
          done
          node build.mjs
      - name: Commit verified source and remove temporary transfer files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html style.css core.js renderer.js app.js build.mjs server.mjs README.md ARCHITECTURE.md LICENSE TEST-REPORT.md test-results.json '山野-示例.moko' .gitignore
          git rm -r -- .moko-import
          git commit -m 'feat: import MOKO editor source and project documentation'
          git push origin HEAD:main
          git rev-parse HEAD
